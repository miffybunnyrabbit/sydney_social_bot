# Config for src/discover.py
#
# Two discovery techniques, both proven manually before this bot existed:
#   1. IG search sweep — type a query into IG's own search box, read back
#      the account results.
#   2. Collab-tag mining — visit a "hub" account's /tagged/ tab (posts other
#      accounts tagged them in) and pull @handles out of multi-tag collab
#      captions. This is how the bulk of the Asian-society accounts in
#      accounts.yaml were actually found — those clubs don't put "Asian" in
#      their bio, they show up by tagging each other at shared events.
#
# discovery.py rotates through a slice of each list per run (see
# ROTATE_PER_RUN in .env / src/config.py) so a single daily run doesn't have
# to hammer IG with 100+ searches — it spreads the full sweep over
# several days instead.

