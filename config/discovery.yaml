# Hub accounts whose /tagged/ tab tends to surface a cluster of related
# clubs at once (e.g. one collab-event photo tagged 15+ UNSW societies).
# discover.py fetches https://instagram.com/<handle>/tagged/, scrolls a
# few screens, and regex-extracts @handles out of "Photo by X ... with
# @a, @b, @c" caption lines.
tagged_hub_accounts:
  - chopsticks_usyd
  - vsausyd
  - sumahjong
  - wasabi_usyd
  - unswkpop
  - unswhksa
  - unswmso
  - community_sydney_japanese
  - ripple.social.sydney
  - rnrunclub

# Accounts/keywords that show up constantly but aren't social clubs —
# filtered out of discovery results automatically. Add to this as you see
# junk slip through (study-abroad agencies, meme pages, vendors, etc).
# IMPORTANT: put the handle of whatever Instagram account vb is logged in
# as here — it shows up in every single search result since you're always
# "logged in as yourself".
noise_handles:
  - about
  - meta
  - instagram
  - threads
  - nathn_nguyn # the account vb was attached to when this list was built — change if different on your server
